<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Alliance HQ — Crazy Joe</title>
<style>
:root{--bg:#0d0e10;--p:#18191d;--p2:#23252b;--line:#383b43;--txt:#f7f7f8;--mut:#b8bac2;--gold:#d6b36d;--blue:#7eafff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b0c0e,#13151a);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:900px;margin:auto;padding:12px 12px 90px}header{position:sticky;top:0;z-index:4;background:#0d0e10ee;backdrop-filter:blur(10px);padding:11px 0;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0}small,.muted{color:var(--mut)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tab,.btn{border:1px solid var(--line);background:var(--p2);color:var(--txt);padding:11px;border-radius:11px;font-weight:800}
.tab.active,.primary{background:linear-gradient(#e0c080,#b88b3e);color:#17120a;border-color:#eed59f}
.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:12px}.card h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:12px;color:var(--mut)}input,select{width:100%;margin-top:5px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--p2);color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:var(--p2);border:1px solid var(--line);padding:9px;border-radius:11px;text-align:center}.stat b{display:block;font-size:19px}
.roster{display:grid;gap:7px;max-height:56vh;overflow:auto}.player{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--p2);border:1px solid var(--line);padding:8px;border-radius:11px}
.member{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:var(--p2);border:1px solid var(--line);padding:8px;border-radius:11px}
.rank{width:34px;height:34px;border-radius:9px;background:#111216;color:var(--gold);display:grid;place-items:center;font-weight:900}.name{font-weight:750;overflow-wrap:anywhere}
.status{border:0;border-radius:999px;min-width:70px;padding:8px;font-weight:900}.off{background:#383a41;color:#ddd}.yes{background:#173f2c;color:#90f0bd}.sub{background:#4b3816;color:#ffd37c}
.bt{border:0;border-radius:999px;min-width:54px;padding:8px;font-weight:900}.bt1{background:#173858;color:#9bcaff}.bt2{background:#4a254f;color:#efb0fa}
.actions{position:sticky;bottom:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.hidden{display:none!important}
.teamgrid{display:grid;gap:10px}.team{background:var(--p);border:1px solid var(--line);border-radius:15px;overflow:hidden}.teamhead{display:flex;justify-content:space-between;padding:11px 12px;background:#211d15;border-bottom:1px solid #5e4a26}.teamhead h3{margin:0;color:#ffe0a0}
.meta{font-size:12px;color:#d5c39e;text-align:right}.members{display:grid;gap:7px;padding:8px}.member.selected{outline:2px solid var(--blue)}.swap{border:0;background:transparent;color:var(--mut)}
.subline{margin:0 8px 8px;border:1px dashed #6b5428;background:#221d13;padding:9px;border-radius:10px;color:#ffe1a3}.balance{background:#153526;border:1px solid #286847;color:#abf2ca;padding:11px;border-radius:11px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:white;color:#111;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(min-width:700px){.roster,.teamgrid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header><h1>Alliance HQ</h1><small>Crazy Joe Mobile Team Builder • CAN 2578</small>
<div class="tabs"><button id="selectTab" class="tab active">1. Select Players</button><button id="teamsTab" class="tab">2. Teams</button></div></header>
<section id="selectView">
<div class="card"><h2>Event setup</h2><div class="grid">
<label>Event time<select id="eventTime"><option>15:00 UTC</option><option>20:00 UTC</option></select></label>
<label>Players per team<select id="teamSize"><option selected>6</option><option>5</option><option>7</option><option>8</option></select></label>
<label>Date<input type="date" id="eventDate"></label><label>Team count<input disabled id="teamCount"></label>
</div><div class="stats"><div class="stat"><b id="yc">0</b><span>YES</span></div><div class="stat"><b id="sc">0</b><span>SUBS</span></div><div class="stat"><b id="oc">86</b><span>OFF</span></div></div></div>
<div class="card"><h2>Set status and Bear Trap location</h2><div class="grid"><input id="search" placeholder="Search player…"><button class="btn" id="reset">Reset participation</button></div>
<p class="muted">BT locations are preloaded. Tap status: OFF → YES → SUB. Tap BT only when a member changes Bear Trap.</p><div class="roster" id="roster"></div></div>
<div class="actions"><button class="btn" id="save">Save Progress</button><button class="btn primary" id="generate">Generate Teams</button></div>
</section>
<section id="teamsView" class="hidden"><div class="card"><h2>Balanced teams</h2><div class="balance" id="balance"></div><p class="muted">Tap one player, then a player on another team to swap them.</p>
<div class="grid"><button class="btn" id="back">← Edit Selection</button><button class="btn" id="rebalance">Rebalance</button></div></div>
<div class="teamgrid" id="teamGrid"></div><div class="card"><button class="btn primary" style="width:100%" id="copy">Copy All Teams</button></div></section>
</div><div class="toast" id="toast"></div>
<script>

":2,"canyon":2,"status":"Active"},{"name":"Filip","rank":20,"powerRank":22,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"#《 SoLo 》#","rank":27,"powerRank":23,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Jbsnow","rank":10,"powerRank":24,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"BRS aja","rank":12,"powerRank":25,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Timmu","rank":50,"powerRank":26,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Lord Vegnagun","rank":40,"powerRank":27,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Ꭾડ c٥ ×͜×","rank":53,"powerRank":28,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Magic Seal 海豹豹","rank":17,"powerRank":29,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Chronoshift","rank":21,"powerRank":30,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Uranos","rank":23,"powerRank":31,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"NtinaRelentless","rank":9,"powerRank":32,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"ᴮᴜᴺʙᵁɴ","rank":4,"powerRank":33,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"༺SKY༻","rank":35,"powerRank":34,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"A̸Z̸O̸Z̸K̸A̸","rank":44,"powerRank":35,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Floopy","rank":34,"powerRank":36,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Yaya_Bings","rank":26,"powerRank":37,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Ratchin","rank":51,"powerRank":38,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"러브Cat°","rank":31,"powerRank":39,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"AKT","rank":49,"powerRank":40,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"დ Ⓢⓤⓜⓜⓔⓡ დ","rank":15,"powerRank":41,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Doomed","rank":47,"powerRank":42,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"LuxuryRose","rank":71,"powerRank":43,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"RelliK","rank":6,"powerRank":44,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Vins","rank":22,"powerRank":45,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Yahu Kimo","rank":24,"powerRank":46,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Kidbull","rank":37,"powerRank":47,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Melonlord","rank":55,"powerRank":48,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"累累~累累~","rank":46,"powerRank":49,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"SANJII","rank":66,"powerRank":50,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Seren","rank":19,"powerRank":51,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Last Call M","rank":58,"powerRank":52,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Fu2fa2","rank":29,"powerRank":53,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"◥ Vulture ◤","rank":52,"powerRank":54,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Punni","rank":62,"powerRank":55,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Sukuna","rank":77,"powerRank":56,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"SteelCityInsider","rank":72,"powerRank":57,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Brother Yattyyyy","rank":13,"powerRank":58,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"伦恩少侠911","rank":41,"powerRank":59,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Bóbr Kurva","rank":36,"powerRank":60,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Doomsday","rank":84,"powerRank":61,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Angel Winnie","rank":38,"powerRank":62,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"BingoBalls","rank":70,"powerRank":63,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Kayzersoze77","rank":69,"powerRank":64,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"▹로지~ROSIE◃","rank":33,"powerRank":65,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Skadis༒B","rank":63,"powerRank":66,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Shoushana","rank":56,"powerRank":67,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Fckck","rank":81,"powerRank":68,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Soulless","rank":73,"powerRank":69,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Atiba","rank":65,"powerRank":70,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"FatCHUCK","rank":80,"powerRank":71,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"‫ىسيع‬","rank":78,"powerRank":72,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"SpikeCujo","rank":39,"powerRank":73,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Wildkid","rank":68,"powerRank":74,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"_","rank":74,"powerRank":75,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Bat Shore","rank":75,"powerRank":76,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Gritsayenko","rank":76,"powerRank":77,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"DonMeloooon","rank":79,"powerRank":78,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Youshe","rank":43,"powerRank":79,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Noura","rank":82,"powerRank":80,"bt":"BT1","foundry":2,"canyon":2,"status":"Active"},{"name":"Lexie","rank":45,"powerRank":81,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"BaniAdam","rank":67,"powerRank":82,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Fawkes of Chaos","rank":61,"powerRank":83,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Pingu","rank":85,"powerRank":84,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"Chaotic bread","rank":83,"powerRank":85,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"},{"name":"BoneCarver","rank":86,"powerRank":86,"bt":"BT2","foundry":1,"canyon":1,"status":"Active"}];
const KEY='allianceHQcj6_preloadedCAN_rosterOct2026';
let st=Object.fromEntries(roster.map(p=>[p.name,'off']));
let bt=Object.fromEntries(roster.map(p=>[p.name,p.bt]));
let teams=[],subs=[],teamBT=[],teamLabels=[],pick=null;
const q=s=>document.querySelector(s);
q('#eventDate').value=new Date().toISOString().slice(0,10);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(s){let t=q('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function save(){localStorage.setItem(KEY,JSON.stringify({st,bt,teams,subs,teamBT,teamLabels,time:q('#eventTime').value,date:q('#eventDate').value,size:q('#teamSize').value}))}
function counts(){let v=Object.values(st),y=v.filter(x=>x==='yes').length,s=v.filter(x=>x==='sub').length;q('#yc').textContent=y;q('#sc').textContent=s;q('#oc').textContent=roster.length-y-s;let sz=+q('#teamSize').value,b1=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT1').length,b2=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT2').length;q('#teamCount').value=(b1?Math.ceil(b1/sz):0)+(b2?Math.ceil(b2/sz):0);save()}
function renderRoster(){let z=q('#search').value.toLowerCase(),b=q('#roster');b.innerHTML='';roster.filter(p=>p.name.toLowerCase().includes(z)).forEach(p=>{let d=document.createElement('div'),x=st[p.name],loc=bt[p.name];d.className='player';d.innerHTML=`<div class="name">${esc(p.name)}</div><button class="bt ${loc==='BT1'?'bt1':'bt2'}">${loc}</button><button class="status ${x}">${x==='off'?'OFF':x.toUpperCase()}</button>`;d.querySelector('.status').onclick=()=>{st[p.name]={off:'yes',yes:'sub',sub:'off'}[x];renderRoster();counts()};d.querySelector('.bt').onclick=()=>{bt[p.name]=loc==='BT1'?'BT2':'BT1';renderRoster();counts()};b.appendChild(d)})}
function score(t){return t.reduce((a,p)=>a+p.rank,0)}
function optimizeGroup(ts){for(let z=0;z<250;z++){let sums=ts.map(score),before=Math.max(...sums)-Math.min(...sums),done=false;outer:for(let a=0;a<ts.length;a++)for(let b=a+1;b<ts.length;b++)for(let i=0;i<ts[a].length;i++)for(let j=0;j<ts[b].length;j++){let test=sums.slice();test[a]=sums[a]-ts[a][i].rank+ts[b][j].rank;test[b]=sums[b]-ts[b][j].rank+ts[a][i].rank;if(Math.max(...test)-Math.min(...test)<before){[ts[a][i],ts[b][j]]=[ts[b][j],ts[a][i]];done=true;break outer}}if(!done)break}ts.forEach(t=>t.sort((a,b)=>a.rank-b.rank))}
function buildPool(players,location,size){if(!players.length)return {ts:[],ss:[],labels:[]};let n=Math.ceil(players.length/size),ts=Array.from({length:n},()=>[]);players.sort((a,b)=>a.rank-b.rank).forEach((p,i)=>{let row=Math.floor(i/n),col=i%n,idx=row%2?n-1-col:col;ts[idx].push(p)});optimizeGroup(ts);return {ts,ss:Array.from({length:n},()=>[]),labels:ts.map((_,i)=>`${location} TEAM ${i+1}`)}}
function generate(){let size=+q('#teamSize').value,y1=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT1'),y2=roster.filter(p=>st[p.name]==='yes'&&bt[p.name]==='BT2'),s1=roster.filter(p=>st[p.name]==='sub'&&bt[p.name]==='BT1'),s2=roster.filter(p=>st[p.name]==='sub'&&bt[p.name]==='BT2');if(y1.length+y2.length<2){toast('Select at least 2 YES players');return false}let a=buildPool(y1,'BT1',size),b=buildPool(y2,'BT2',size);s1.forEach((p,i)=>a.ss.length&&a.ss[i%a.ss.length].push(p));s2.forEach((p,i)=>b.ss.length&&b.ss[i%b.ss.length].push(p));teams=[...a.ts,...b.ts];subs=[...a.ss,...b.ss];teamBT=[...a.ts.map(()=>'BT1'),...b.ts.map(()=>'BT2')];teamLabels=[...a.labels,...b.labels];pick=null;renderTeams();save();return true}
function renderTeams(){let b=q('#teamGrid');b.innerHTML='';q('#balance').innerHTML=`<b>BT1 and BT2 are kept separate</b><br>${teams.length} total teams • Teams are balanced by Gaia rank within each BT.`;teams.forEach((t,ti)=>{let d=document.createElement('div');d.className='team';d.innerHTML=`<div class="teamhead"><h3>${teamLabels[ti]}</h3><div class="meta">Rank sum: ${score(t)}<br>Avg rank: ${(score(t)/t.length).toFixed(1)}</div></div><div class="members"></div>`;let m=d.querySelector('.members');t.forEach((p,pi)=>{let r=document.createElement('div');r.className='member'+(pick&&pick.ti===ti&&pick.pi===pi?' selected':'');r.innerHTML=`<div class="rank">${p.rank}</div><div class="name">${esc(p.name)}</div><button class="swap">Swap</button>`;r.onclick=()=>swap(ti,pi);m.appendChild(r)});let sl=document.createElement('div');sl.className='subline';sl.innerHTML=`<b>SUB${subs[ti]?.length===1?'':'S'}:</b> ${subs[ti]?.length?subs[ti].map(x=>esc(x.name)).join(', '):'None assigned'}`;d.appendChild(sl);b.appendChild(d)})}
function swap(ti,pi){if(!pick){pick={ti,pi};renderTeams();toast('Tap a player on another team');return}if(pick.ti===ti){pick=null;renderTeams();return}if(teamBT[pick.ti]!==teamBT[ti]){pick=null;renderTeams();toast('BT1 and BT2 players cannot be swapped');return}[teams[pick.ti][pick.pi],teams[ti][pi]]=[teams[ti][pi],teams[pick.ti][pick.pi]];teams[pick.ti].sort((a,b)=>a.rank-b.rank);teams[ti].sort((a,b)=>a.rank-b.rank);pick=null;renderTeams();save();toast('Players swapped')}
function show(which){q('#selectView').classList.toggle('hidden',which==='teams');q('#teamsView').classList.toggle('hidden',which!=='teams');q('#selectTab').classList.toggle('active',which!=='teams');q('#teamsTab').classList.toggle('active',which==='teams');scrollTo(0,0)}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;st={...st,...d.st};bt={...bt,...(d.bt||{})};teams=d.teams||[];subs=d.subs||[];teamBT=d.teamBT||[];teamLabels=d.teamLabels||[];if(d.time)q('#eventTime').value=d.time;if(d.date)q('#eventDate').value=d.date;if(d.size)q('#teamSize').value=d.size}catch(e){}}
function copy(){let out=`🔥 CRAZY JOE TEAMS 🔥\n${q('#eventDate').value} • ${q('#eventTime').value}\n`;teams.forEach((t,i)=>{out+=`\n⚔️ ${teamLabels[i]}\n`;t.forEach(p=>out+=`• ${p.name}\n`);out+=`SUB${subs[i]?.length===1?'':'S'}: ${subs[i]?.length?subs[i].map(x=>x.name).join(', '):'None'}\n`});navigator.clipboard.writeText(out).then(()=>toast('Teams copied')).catch(()=>prompt('Copy teams:',out))}
q('#search').oninput=renderRoster;q('#teamSize').onchange=counts;q('#save').onclick=()=>{save();toast('Progress saved')};q('#generate').onclick=()=>{if(generate())show('teams')};q('#rebalance').onclick=()=>{generate();toast('Rebalanced')};q('#back').onclick=()=>show('select');q('#selectTab').onclick=()=>show('select');q('#teamsTab').onclick=()=>teams.length?show('teams'):toast('Generate teams first');q('#copy').onclick=copy;
q('#reset').onclick=()=>{if(confirm('Clear participation selections? BT assignments will stay preloaded.')){st=Object.fromEntries(roster.map(p=>[p.name,'off']));teams=[];subs=[];teamBT=[];teamLabels=[];save();renderRoster();counts()}};
load();renderRoster();counts();
</script>
</body>
</html>
